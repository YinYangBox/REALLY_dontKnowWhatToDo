<!DOCTYPE html>
<html lang="es">
<head>
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <img src="BolaMUYnormal.png" id="The-ball"></img>
    <img src="arrow.png" id="arrow-selector" class="rotate">
    <form id="mode">
        <button id="two-players" type="submit">2 players</button>
        <button id="one-player" type="submit">1 player</button>
    </form>
    <form id="dificulty">
        <label for="dificulty-selector">What will be your dificulty?</label>
        <input type="range" id="dificulty-selector" name="dificulty" min="1" max="4" step="0.1" value="2">
        <button type="submit" id="start">Start</button>
    </form>
    <div id="player1">
        <span id="player1-score" class="score">0</span>
    </div>
    <div id="player2">
        <span id="player2-score" class="score">0</span>
    </div>
</body>
</html>
